<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Linguatec · Control de Asistencia</title>
    <!-- Archivo de estilos principal -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Logotipo de Linguatec -->
            <div class="login-header">
                <div class="logo-container">
                    <!-- imagen del logotipo -->
                    <img src="recursos/logotipo.webp" alt="Logotipo de Linguatec" class="main-logo">
                </div>
                <p class="brand-subtitle">Control de Asistencia</p>
            </div>

            <!-- Formulario de Login -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@linguatec.com" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn-primary">
                    Iniciar Sesión
                </button>

                <div id="errorMessage" class="error-message" role="alert"></div>
            </form>

            <!-- Pie de página -->
            <div class="login-footer">
                <p>© 2026 - Proyecto de Estadia Profesional</p>
                <p>Linguatec - Control de Asistencia</p>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->  
    <!-- Configuración de Firebase -->
    <script src="js/config.js"></script>
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- Lógica de Firebase (app.js) -->
    <script src="js/app.js"></script>
    <!-- Lógica específica de Autenticación (auth.js) -->
    <script src="js/auth.js"></script>

</body>
</html>
